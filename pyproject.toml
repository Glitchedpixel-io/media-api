[project]
name = "media-api"
description = "Provides access to the media database."
authors = [
    {name = "Philip",email = "gp@glitchedpixel.io"}
]
license = "MIT"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.121.2",
    "uvicorn[standard]>=0.38.0",
    "psycopg[binary]>=3.2.12,<4.0.0",
    "sqlalchemy>=2.0.44,<3.0.0",
    # Not just a dev tool for authoring migrations: the deploy pipeline runs
    # `alembic upgrade head` inside this same production image at deploy time.
    "alembic>=1.17.0",
    "pydantic[email]>=2.12.4,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "requests>=2.31.0,<3.0.0",
    "httpx>=0.27.2",
    "elasticsearch>=9.2.0,<10.0.0",
    "sqlakeyset>2.0.1746777265,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "logfire[fastapi,sqlalchemy]>=4.14.2,<5.0.0",
    "opentelemetry-instrumentation-elasticsearch>=0.59b0,<0.60",
    "ecdsa==0.19.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
# Prefect is an optional orchestration provider. The default (empty
# enabled_orchestration_providers) pure pull model and the DB-backed pull
# queue work without it: `uv add 'media-api[prefect]'` only when "prefect" is
# actually listed in ENABLED_ORCHESTRATION_PROVIDERS.
prefect = [
    "prefect>=3.6.2,<4.0.0",
]

[project.scripts]
# The capability-inventory harness (tools/capability_inventory). It lives in this
# project rather than a separate one so it can import the app object directly and
# generate the OpenAPI document in process, with no server running.
capability-inventory = "tools.capability_inventory.cli:main"

[project.entry-points."media_api.orchestration_providers"]
prefect = "app.orchestration.prefect:PrefectProvider"
webhook = "app.orchestration.webhook:WebhookProvider"

[dependency-groups]
dev = [
    "black>=25.1.0",
    # Not a production dependency (see [project.optional-dependencies]), but
    # tests/unit/runners/test_prefect_runner.py patches "prefect.*" targets by
    # string, which requires the real package to be importable even though
    # app/runners/prefect_runner.py only imports it lazily at call time.
    "prefect>=3.6.2,<4.0.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.1",
    "anyio>=4.4.0",
    "faker>=30.8.2",
    "factory-boy>=3.3.1",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.112.1",
    "freezegun>=1.5.1",
    "respx>=0.21.1",
    "mutmut>=2.5.1",
    "mypy>=1.18.2",
    "types-requests>=2.32.4.20250913",
    "ruff>=0.14.2",
    # Reads tools/capability_inventory/probes.yaml.
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["app", "tools"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
xfail_strict = true

addopts = """
-ra -q --strict-markers --strict-config --color=yes
--maxfail=1 --durations=10
--cov=app --cov-report=term-missing:skip-covered --cov-fail-under=85
"""

# Register markers so pytest 8 doesn’t warn; descriptions double as docs.
markers = [
  "unit: fast, no I/O; mock repositories/services at protocol boundaries",
  "contract: repository protocol conformance across implementations",
  "integration: database/migrations/sql behaviour (usually Postgres)",
  "api: FastAPI layer with dependency overrides and httpx ASGI transport",
  "e2e: full stack with real services",
  "worker: worker-specific tests that may require special setup",
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

filterwarnings = [
  "error::DeprecationWarning",
  "ignore:SelectableGroups dict interface is deprecated",
  "ignore:pkg_resources is deprecated.*",
  "ignore:There is no current event loop:DeprecationWarning",
]

[tool.coverage.run]
omit = [
    "*/main.py",
    "*/dependencies.py",
    "*/app_factory.py",
    "app/auth/*",
    "workers/cli_utils.py",
    "tools/*"
]

[tool.mypy]
python_version = "3.13"
plugins = [
  "sqlalchemy.ext.mypy.plugin",
  "pydantic.mypy"
]
files = ["app"]
exclude = [
  "tests/.*",     # skip tests
]

# Strictness
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# Tolerate libraries without stubs
ignore_missing_imports = true

# Optional: make CI easier to read
show_error_codes = true
pretty = true

# Per-module overrides if you want to quiet specific noisy deps
[[tool.mypy.overrides]]
module = [
  "prefect.*",
  "yt_dlp.*",
  "openai_whisper.*",
  "python_telegram_bot.*",
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "alembic/*",
  "tests/*",
]


[tool.ruff.lint]
# Deliberately narrow — see the decision recorded on issue #30. The correctness
# core (E, F) plus two individually-chosen rules, gated in CI. Widening is a
# separate decision, not something to do incidentally.
select = [
  "E",       # pycodestyle errors
  "F",       # pyflakes — undefined names, unused imports/variables, shadowing
  "B904",    # raise-without-from inside except: losing the cause hurts debugging
  "PLC0415", # import-outside-top-level: enforces the import convention in CLAUDE.md
]
# black is the formatter and both are set to line-length 100. The remaining E501
# hits are long string literals and comments black will not split, so enforcing
# it would mean hand-wrapping strings to satisfy a rule the formatter does not
# implement.
ignore = ["E501"]

[tool.ruff.format]
# Turn off Ruff formatting if you want Black to be the formatter:
skip-magic-trailing-comma = false  # (Doesn't disable; instead, just don't run `ruff format`)
# Simply run Black instead of `ruff format`.

[tool.ruff.lint.per-file-ignores]
# Deliberate re-export aggregator. The star imports are the pattern working as
# intended, and account for 133 findings on their own.
"app/schemas/__init__.py" = ["F403", "F405"]
# FastAPI's Depends()-in-defaults idiom. Inert under the current selection since
# B008 is not selected; kept so the exemption survives any widening of "B".
"app/routers/*.py" = ["B008"]
"app/dependencies.py" = ["B008"]
