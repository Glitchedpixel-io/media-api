name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      LOGFIRE_IGNORE_NO_CONFIG: 1
      TEST_DATABASE_URL: postgresql+psycopg://testuser:testpass@db:5432/testdb

    steps:
      - name: Install system dependencies
        run: apt-get update -qq && apt-get install -y -qq git curl gnupg

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history — gitleaks below scans every commit, not just the tip

      # gitleaks/gitleaks-action requires a paid license for a private org repo (free for
      # public repos and the OSS scanner itself); running the plain binary sidesteps that
      # and keeps this working unchanged once the repo goes public. Version pinned and
      # checksummed against the published release manifest.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" checksums.txt | sha256sum -c -
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --log-opts="--all" -v --exit-code 1

      - name: Install dependencies
        run: uv sync --frozen

      # Formatting is enforced here, not by a CLAUDE.md line telling an agent to remember.
      - name: Check formatting (black)
        run: uv run black --check .

      - name: Type check (mypy)
        run: uv run mypy

      # The schema must be buildable from an empty database by migrations alone
      # (no create_all), and the single baseline must stay in sync with the ORM
      # models. `alembic check` fails if a model change lacks a matching migration.
      - name: Migrations build from scratch and match the models
        env:
          ALEMBIC_DATABASE_URL: postgresql+psycopg://testuser:testpass@db:5432/migcheck
        run: |
          uv run python - <<'PY'
          import psycopg

          conn = psycopg.connect(
              "postgresql://testuser:testpass@db:5432/postgres", autocommit=True
          )
          conn.execute("DROP DATABASE IF EXISTS migcheck")
          conn.execute("CREATE DATABASE migcheck")
          PY
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests
        run: >-
          uv run pytest tests/
          --maxfail=0
          --cov-report=xml
          --junitxml=junit.xml
          -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./junit.xml

      # main only ever gets a squash-merge commit that never runs CI itself (this
      # workflow triggers on pull_request only). codecov-main.yml reuses these reports
      # after merge to attribute coverage to that commit instead of re-running the suite.
      - name: Save coverage reports for reuse on main
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            junit.xml
          retention-days: 7
