name: Publish

# Builds and publishes the Docker image on every release, then notifies the
# private deploy pipeline (Glitchedpixel-io/media-api-deploy) so it can update
# production. This repo has no knowledge of how or where it's actually
# deployed — that's an intentional split, documented internally.
on:
  workflow_run:
    workflows: ["Version Bump"]
    types: [completed]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Get version tag
        id: tag
        run: |
          git fetch --tags
          TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Export OpenAPI schema
        run: uv run python export_openapi.py

      # media-runners' codegen pins against this asset (see media-runners#21). The
      # tag already exists (pushed by Version Bump before this workflow runs), so
      # this is the first thing in the repo to create a GitHub Release — attaching
      # the spec to the same tag the image below is built from keeps "the spec for
      # vX.Y.Z" and "the image for vX.Y.Z" trivially the same reference. Handles
      # re-runs of this workflow (release already exists) by uploading instead.
      - name: Publish OpenAPI schema as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" openapi.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" openapi.json --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The core image depends on no orchestration framework. That is the point
      # of the pluggable provider registry, and it is why EXTRAS defaults empty.
      - name: Build and push (core)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.tag.outputs.version }}
          tags: |
            ghcr.io/glitchedpixel-io/media-api:${{ steps.tag.outputs.version }}
            ghcr.io/glitchedpixel-io/media-api:latest
          cache-from: type=registry,ref=ghcr.io/glitchedpixel-io/media-api:latest
          cache-to: type=inline

      # A separate artifact, not a different default. Environments that enable
      # the prefect provider deploy this tag; everything else stays lean.
      - name: Build and push (prefect flavour)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
            EXTRAS=prefect
          tags: |
            ghcr.io/glitchedpixel-io/media-api:${{ steps.tag.outputs.version }}-prefect
            ghcr.io/glitchedpixel-io/media-api:latest-prefect
          cache-from: type=registry,ref=ghcr.io/glitchedpixel-io/media-api:latest-prefect
          cache-to: type=inline

      # Guards for the failure in #21: enabling a provider is a *runtime* switch
      # but installing it is a *build-time* one, and registry init is deliberately
      # not wrapped in try/except, so a mismatch is a startup crash loop rather
      # than a config error. Nothing in CI previously ran the built image, so the
      # test suite -- which runs in a dev venv where prefect IS installed -- could
      # never see it. `dispatch` needs `build`, so a failure here blocks the deploy.
      - name: Core image carries no orchestration framework
        run: |
          docker run --rm \
            ghcr.io/glitchedpixel-io/media-api:${{ steps.tag.outputs.version }} \
            uv run --no-sync python -c '
          import importlib.util, sys
          if importlib.util.find_spec("prefect") is not None:
              sys.exit("core image contains prefect; it must not depend on an orchestration framework")
          print("core image is orchestration-framework free")
          '

      - name: Prefect flavour can construct the providers it ships
        run: |
          docker run --rm \
            -e APP_ENV=staging \
            -e ENABLED_ORCHESTRATION_PROVIDERS=prefect,webhook \
            -e ORCHESTRATION_PROVIDER_OPTIONS='{"webhook":{"url":"https://example.invalid/hook"}}' \
            -e DATABASE_URL='postgresql+psycopg://u:p@localhost/db' \
            -e LOGFIRE_IGNORE_NO_CONFIG=1 \
            ghcr.io/glitchedpixel-io/media-api:${{ steps.tag.outputs.version }}-prefect \
            uv run --no-sync python -c '
          from app.config.settings import _Settings, _build_orchestration_config
          from app.orchestration.loader import build_provider_registry
          cfg = _build_orchestration_config(_Settings())
          build_provider_registry(cfg)
          print("constructed:", cfg.enabled_providers)
          '

  dispatch:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}   # no checkout, no GITHUB_TOKEN use — only the explicit DEPLOY_DISPATCH_TOKEN below
    steps:
      - name: Notify media-api-deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          gh api repos/Glitchedpixel-io/media-api-deploy/dispatches \
            -f event_type=media-api-released \
            -F "client_payload[tag]=${{ needs.build.outputs.tag }}" \
            -F "client_payload[version]=${{ needs.build.outputs.version }}"
