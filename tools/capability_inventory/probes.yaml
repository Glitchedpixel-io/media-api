# Declarative probe definitions for the capability inventory.
#
# Edit this file to change what Phase 4 measures. Nothing here requires a code
# change, and the harness validates every entry before issuing a single request.
#
# SAFETY
#   The runner refuses any method other than GET unless the exact
#   "METHOD /path" appears in `allowlist` below. `allowlist` ships empty and
#   should stay that way unless you are deliberately probing a write against an
#   instance you are willing to mutate. Probing production writes is not a thing
#   this harness will do by accident.
#
# VARIABLES
#   `{name}` placeholders in a probe's `path`, and in any string value under its
#   `query`, are filled from `variables`.
#   A variable is resolved against the API itself, so probes stay valid as the
#   library changes and the file needs no ids hard-coded into it. If resolution
#   fails, every probe depending on that variable is reported as `unavailable`
#   with the reason -- never silently skipped.
#
# FAILURE-MODE PROBES
#   `records_failure_mode: true` marks a probe that exists to record *how* something
#   fails rather than what it costs. Such a probe is reported like any other and
#   contributes nothing to a verdict: its timing describes the failure path, not the
#   endpoint doing its work.
#
#   Set it whenever `expect_status` accepts a status meaning the endpoint did not do
#   its job. Do not set it merely because a status is not 2xx -- a by-scheme lookup
#   that misses runs the same query as one that hits, and an unsatisfiable range is
#   the endpoint behaving correctly. Both are real measurements.
#
#   Never put a query string in `path`. A path carrying `?` matches no route, so
#   the probe would time successfully but its result could not be attached to an
#   endpoint, which reports UNKNOWN while this file still looks correct. The
#   loader rejects it.

version: 1

defaults:
  # Runs after the discarded warm-up. p50 and p95 are computed over these.
  runs: 7
  warmup: 1
  timeout_seconds: 30

# Non-GET routes that may be probed. Keep empty for read-only runs.
#
# It is deliberately empty, and the mutating endpoints are deliberately unmeasured
# as a result. Timing a write means performing it, and this report is run against
# production data; the alternatives -- a seeded throwaway instance, or writing and
# undoing -- either measure the wrong scale or leave the mutation behind when a
# probe run dies part-way. What a write costs is established from its query shape
# instead, and the per-payload cost of the tag writes is asserted by a query-count
# test rather than a timing.
allowlist: []

variables:
  asset_id:
    from_endpoint: /api/assets/
    query: {limit: 1, sort: "id:asc"}
    pick: items.0.id
  title_id:
    from_endpoint: /api/titles/
    query: {limit: 1, sort: "id:asc"}
    pick: items.0.id
  # Same value as title_id. `/api/titles/{parent_title_id}/contents` names its
  # path parameter differently, and a probe path has to spell the placeholder
  # exactly as the route declares it or the result cannot be attached to it.
  parent_title_id:
    from_endpoint: /api/titles/
    query: {limit: 1, sort: "id:asc"}
    pick: items.0.id
  tag_id:
    from_endpoint: /api/tags
    query: {limit: 1, sort: "id:asc"}
    pick: items.0.id
  scheme_id:
    from_endpoint: /api/id_schemes
    pick: 0.id
  # The title with the most children, so the "4000-item case" is measured rather
  # than assumed. Resolved by asking for the largest collection the API exposes.
  # `/api/transform_requests/{request_id}` names its path parameter `request_id`.
  #
  # Resolved with `actioned=true` rather than by taking the lowest id. The
  # detail route does not care either way, but `/logs` checks `actioned` before
  # it does anything and 409s otherwise -- which is why that endpoint had never
  # once been measured. One variable serves both probes, and a placeholder has
  # to be spelled as the route declares it, so this is where the choice is made.
  request_id:
    from_endpoint: /api/transform_requests
    query: {limit: 1, sort: "id:desc", actioned: true}
    pick: items.0.id
  stream_id:
    from_endpoint: /api/streams
    query: {limit: 1, sort: "id:asc"}
    pick: items.0.id
  title_type_id:
    from_endpoint: /api/title_types
    pick: 0.id
  # Read from an endpoint that is itself addressed by a variable. Resolution is
  # ordered by dependency, not alphabetically, so `asset_id` is available here.
  metadata_id:
    from_endpoint: /api/assets/{asset_id}/metadata
    pick: 0.id
  scheme_code:
    from_endpoint: /api/id_schemes
    pick: 0.code
  # Deliberately a value no row holds. A by-scheme lookup that misses runs the
  # same query as one that hits and cannot short-circuit, so it measures the scan
  # honestly -- and unlike a real pair it needs no title to happen to carry an
  # identifier in the scheme that `scheme_id` resolved to, which would couple
  # these probes to the shape of whatever data the instance holds.
  external_id:
    literal: "capinv-probe-no-such-external-id"

  # Resolved from the artwork collection route (#121), which is one hop and does
  # not depend on any particular entity carrying artwork.
  #
  # This too was previously reachable only through an id a caller already held:
  # there was no collection route over `artwork`, so the variable was resolved
  # from one asset's own artwork list and went unresolvable whenever that asset
  # had none. Reading the collection directly removes that coupling.
  #
  # It still resolves nothing while the artwork table is empty, and every probe
  # that needs it is then reported `unavailable` with that reason rather than
  # silently skipped. An instance that has not had `tools/artwork_backfill` run
  # against it is in exactly that state: the schema and the seeded kinds are
  # deployed, but nothing has registered any artwork yet. Nothing in this file can
  # fix that, and it should not try -- no `fallback`, for the same reason the
  # `runner_key` note below gives.
  artwork_id:
    from_endpoint: /api/artwork
    query: {limit: 1, sort: "id:asc"}
    pick: items.0.id

  # There is deliberately no `runner_key` variable, so
  # GET /api/runner_state/{runner_key} stays unprobed.
  #
  # A runner is provisioned with its own key and uses it to look up its
  # configuration, so no client ever discovers a key and there is no listing route
  # to resolve one from -- the absence is the design, not a gap. Do not add a
  # literal here: any key hardcoded in this file is wrong on every instance but the
  # one it was copied from, and a probe that 404s against a real key would report
  # the endpoint as broken rather than unmeasured.

probes:
  # -- happy path: first screen ------------------------------------------
  - name: assets-page-1
    path: /api/assets/
    query: {limit: 50}
    note: default first page a browse screen would issue

  - name: assets-page-1-with-includes
    path: /api/assets/
    query: {limit: 50, include: "tags,master_asset,external_ids"}
    note: same page with every optional relation eager-loaded

  - name: titles-page-1
    path: /api/titles/
    query: {limit: 50}

  # -- isolating display-image resolution --------------------------------
  # This pair used to be `titles-page-1` against the same request with
  # `include=poster`, on the theory that the second measured resolution and the
  # first did not. It measured nothing: the two returned byte-identical
  # payloads, because `display_image` resolves by default and is not gated by
  # `include=`, so `include=poster` is a no-op. Both probes timed the same work
  # and the difference between them was noise being read as a signal.
  #
  # The real distinction is whether a row resolves a display image, which
  # `resolves_display_image` (#122) asks directly. `has_artwork` looks like the
  # same question and is not: it asks whether a title holds artwork *itself*,
  # and on this library the answer is no for every single title -- all 1,205
  # artwork rows hang off assets, so `has_artwork=true` returns an empty page.
  # A pair built on it would measure a zero-row response against a full one,
  # which is the same "measures nothing" failure as the `include=poster` pair it
  # replaced. `has_artwork=true` is kept below as a one-row finding rather than
  # as half of a timing pair.
  - name: titles-resolving-page-1
    path: /api/titles/
    query: {limit: 50, resolves_display_image: true}
    note: >-
      the hit path -- 50 rows that each resolve a display image, every one of
      them borrowed from a contained asset. Pairs with
      `titles-not-resolving-page-1`, and the gap between them is what the walk
      costs when it fails.

  - name: titles-not-resolving-page-1
    path: /api/titles/
    query: {limit: 50, resolves_display_image: false}
    note: >-
      the miss path -- rows where the walk ascends to its depth cap and finds
      nothing. 181 of 1,136 library roots are in this state, and every one of
      them is a hole in the grid that needs the typographic treatment.

  - name: titles-owning-artwork
    path: /api/titles/
    query: {limit: 50, has_artwork: true}
    note: >-
      not a timing measurement -- a recorded fact. This returns an empty page
      on the whole library: no Title holds artwork of its own, so every image
      the grid shows is borrowed from an asset through the resolution chain.
      A design that assumes a title can own its poster has nothing behind it.

  # -- the placement queue (#177) ----------------------------------------
  # Four probes rather than two, because the pair on each resource is the whole
  # point: `false` is a negated correlated EXISTS and `true` is the plain one,
  # they should partition the collection, and the item counts recorded here are
  # what says whether they do on the real library. Two numbers that do not sum
  # to the collection are a filter that has stopped being a negation.
  #
  # The counts also answer a design question the report cannot otherwise state:
  # how much loose material there actually is. A queue holding four assets and a
  # queue holding four thousand are different screens.
  - name: assets-unplaced-page-1
    path: /api/assets/
    query: {limit: 50, has_intrinsic_parent: false}
    note: >-
      the drag source -- assets with no intrinsic home, which is the queue the
      whole placement workflow starts from. Curated listings deliberately do not
      count as placed, so an asset sitting only in a collection appears here.
      Pairs with `assets-placed-page-1`; the two should partition `assets`.

  - name: assets-placed-page-1
    path: /api/assets/
    query: {limit: 50, has_intrinsic_parent: true}
    note: >-
      the other half of the pair. Both directions are served by
      `ix_title_contents_asset_membership`, whose leading column is `asset_id` --
      nothing indexed that column before #177, and `uq_parent_asset_once` cannot
      serve it because it leads with `parent_title_id`.

  - name: titles-unparented-page-1
    path: /api/titles/
    query: {limit: 50, has_intrinsic_parent: false, library_root: false}
    note: >-
      titles with no home that are not deliberate entry points either. Rootness
      is stored rather than derived from having a parent (#91), so this is the
      conjunction of two filters and not one -- a library root with no parent is
      not misplaced. Served by `uq_one_intrinsic_parent`, whose partial predicate
      is exactly this condition.

  - name: titles-parented-page-1
    path: /api/titles/
    query: {limit: 50, has_intrinsic_parent: true}
    note: >-
      the pair's other half, and a cross-check: this returns the same set as
      `membership=intrinsic`, which is the half the containment filter could
      already express. A divergence between them is a bug in one of the two.

  - name: titles-poster-scaling-200-rows
    path: /api/titles/
    query: {limit: 200, include: "poster"}
    note: >-
      poster resolution against 200 rows -- compare with the 50-row probe above
      to tell a per-row walk from a fixed cost

  # The pair above resolves nothing on this library: the default page is the
  # oldest titles, which predate the covers, so every row walks its contents to
  # the depth limit and comes back empty. That is the *miss* path, and it is the
  # expensive one worth having -- but on its own it says nothing about what a
  # grid full of posters costs, on a different slice of the library than the
  # `has_artwork` pair above.
  #
  # This was also a pair with `include=poster`, and was wrong for the same
  # reason: `include=poster` changes nothing, so the two probes returned
  # identical bytes and the commentary claiming one measured resolution and the
  # other did not described something that never happened. What is left is a
  # single honest measurement of the newest page, kept because sort order
  # changes which rows are fetched and therefore what the resolution finds.
  - name: titles-newest-page
    path: /api/titles/
    query: {limit: 50, sort: "id:desc"}
    note: >-
      the newest page, which a "recently added" view would issue. Compare
      against `titles-page-1` for the effect of sort order, and against the
      `has_artwork` pair above for the cost of resolution itself.

  - name: tags-page-1
    path: /api/tags
    query: {limit: 50}

  - name: transform-requests-page-1
    path: /api/transform_requests
    query: {limit: 50}

  # -- isolating the two independent costs -------------------------------
  # `assets-page-1` and `assets-page-1-with-includes` return byte-identical
  # payloads. Any latency difference between them is the per-row lazy load on
  # AssetORM.external_ids and nothing else, because `include=` converts those
  # per-row SELECTs into one selectinload. The scaling probes then show whether
  # that cost is linear in the number of rows, which is what distinguishes an
  # N+1 from a fixed overhead.
  - name: assets-scaling-10-rows
    path: /api/assets/
    query: {limit: 10}
    note: N+1 scaling, 10 rows

  - name: assets-scaling-200-rows
    path: /api/assets/
    query: {limit: 200}
    note: N+1 scaling, 200 rows -- compare against the 10- and 50-row probes

  # -- realistic worst case ---------------------------------------------
  - name: assets-max-page-unindexed-sort
    path: /api/assets/
    query: {limit: 500, sort: "size:desc"}
    note: largest permitted page on an unindexed sort key, N+1 left in place

  - name: assets-max-page-unindexed-sort-no-n1
    path: /api/assets/
    query: {limit: 500, sort: "size:desc", include: "external_ids"}
    note: >-
      the same worst case with the per-row lazy load eliminated. The gap between
      this and the probe above is the N+1; what remains is the sort itself

  - name: assets-indexed-sort-no-n1
    path: /api/assets/
    query: {limit: 500, sort: "id:asc", include: "external_ids"}
    note: >-
      control for the probe above -- an indexed sort key with the N+1 removed, so
      the two differ only in whether the sort column is indexed


  - name: assets-broadest-filter
    path: /api/assets/
    query: {limit: 50, path_part: "e"}
    note: >-
      substring filter matching almost everything; sequential scan by construction.
      One character on purpose, and it is the reason this does not contradict the
      coverage row above: `ix_assets_path_trgm` serves this filter from three
      characters up, and a pattern shorter than that contains no whole trigram, so
      the planner cannot use it. This measures that floor rather than the ordinary
      case

  - name: titles-name-substring
    path: /api/titles/
    query: {limit: 50, name: "e"}
    note: leading-wildcard name search, the broadest a UI search box can send

  # -- deep pagination ---------------------------------------------------
  - name: assets-deep-page
    path: /api/assets/
    query: {limit: 50}
    paginate: {style: keyset, pages: 40}
    note: page 41 reached by following cursors; compare against assets-page-1

  - name: titles-deep-page
    path: /api/titles/
    query: {limit: 50}
    paginate: {style: keyset, pages: 40}

  # Twenty pages rather than the forty the two listings above walk. `artwork` is
  # an order of magnitude smaller than `assets`, and a walk that outruns the
  # collection measures nothing: it reports `unavailable` for want of a page 41,
  # which is what `titles-deep-page` already does here. Twenty is chosen to sit
  # inside the collection at its present size while still being deep enough for
  # a cursor to have drifted if it were going to.
  - name: artwork-deep-page
    path: /api/artwork
    query: {limit: 50}
    paginate: {style: keyset, pages: 20}
    note: >-
      page 21 by cursor; compare against artwork-page-1. Kept beside the other
      deep walks rather than in the artwork section, because what it measures is
      cursor stability at depth rather than anything about artwork

  - name: search-transcripts-page-1
    path: /api/search/transcripts
    query: {q: "the", size: 25, offset: 0}

  - name: search-transcripts-deep-page
    path: /api/search/transcripts
    query: {q: "the", size: 25}
    paginate: {style: offset, offset: 9975}
    note: last page inside the default 10,000 max_result_window

  - name: search-transcripts-past-window
    path: /api/search/transcripts
    query: {q: "the", size: 25}
    paginate: {style: offset, offset: 10000}
    expect_status: [200, 500, 503]
    records_failure_mode: true
    note: deliberately past max_result_window; records how the failure surfaces

  # -- unbounded collections --------------------------------------------
  - name: streams-page-1
    path: /api/streams
    query: {limit: 50}
    note: default first page a browse screen would issue

  - name: streams-max-page
    path: /api/streams
    query: {limit: 500}
    note: largest permitted page; the old uncapped response was 65,739 rows and 15.15MB

  - name: streams-by-asset
    path: /api/streams
    query: {asset_id: "{asset_id}", limit: 50}
    note: >-
      the filtered read a client actually wants; streams.asset_id is unindexed until #53
      lands, so a slow result here is that index, not the paging

  - name: inbox-full
    path: /api/inbox
    note: >-
      the default walk, bounded by MAX_DEPTH and MAX_ITEMS; size depends on what is
      sitting in the inbox at the time, so read it as a sample rather than a ceiling

  - name: inbox-top-level
    path: /api/inbox
    query: {depth: 1}
    note: one level only, the cheapest useful request a client can make

  - name: id-schemes-all
    path: /api/id_schemes

  - name: title-parents
    path: /api/titles/{title_id}/parents
    note: >-
      uncapped, and the upward counterpart of title-contents. Immediate parents
      only, so its cost is bounded by how many titles contain this one rather
      than by the size of any listing

  - name: title-contents
    path: /api/titles/{parent_title_id}/contents
    note: unpaginated child list; size is whatever that title happens to hold

  - name: asset-streams
    path: /api/assets/{asset_id}/streams

  - name: asset-metadata
    path: /api/assets/{asset_id}/metadata

  - name: asset-external-ids
    path: /api/assets/{asset_id}/ids

  - name: asset-tags
    path: /api/assets/{asset_id}/tags

  - name: asset-titles
    path: /api/assets/{asset_id}/titles

  - name: title-tags
    path: /api/titles/{title_id}/tags

  # -- single-object reads ----------------------------------------------
  - name: asset-detail
    path: /api/assets/{asset_id}

  - name: title-detail
    path: /api/titles/{title_id}

  - name: title-detail-with-poster
    path: /api/titles/{title_id}
    query: {include: "poster"}
    note: >-
      pairs with `title-detail` the way the listing pair above does: one title's
      share of the contents walk, which a detail view pays on its own

  - name: tag-detail
    path: /api/tags/{tag_id}

  - name: transform-request-detail
    path: /api/transform_requests/{request_id}

  # -- streaming ---------------------------------------------------------
  # A 404 from any of these means the probed instance has no file for the asset
  # that `asset_id` resolved to -- almost always a run pointed at a real database
  # with the media root not mounted alongside it. It is not evidence that ranges
  # are broken: the 200, 206, suffix-206, 416, 400 and traversal cases are all
  # asserted in tests/unit/api/test_file_stream_router.py and
  # tests/integration/api/test_file_stream_api.py, the latter against a real row
  # and a real file. What these probes add is timing at production scale, which
  # only a mounted media root can provide.
  - name: fetch-asset-stream
    path: /api/fetch/{asset_id}
    stream: true
    note: >-
      time-to-first-byte measured separately from total transfer; a 404 here means
      no file on this instance, not a broken endpoint -- see the note above

  - name: fetch-asset-range
    path: /api/fetch/{asset_id}
    stream: true
    headers: {Range: "bytes=0-1048575"}
    expect_status: [206]
    note: >-
      first mebibyte only; verifies Content-Range and Accept-Ranges; a 404 means no file on this instance

  - name: fetch-asset-range-suffix
    path: /api/fetch/{asset_id}
    stream: true
    headers: {Range: "bytes=-65536"}
    expect_status: [206]
    note: >-
      suffix range, the form a seek-to-end scrub issues; a 404 means no file on this instance

  - name: fetch-asset-range-unsatisfiable
    path: /api/fetch/{asset_id}
    stream: true
    headers: {Range: "bytes=99999999999999-"}
    expect_status: [416]
    note: >-
      verifies the unsatisfiable case returns 416 with a Content-Range header; a 404 means no file on this instance

  # -- detail reads: index-covered, previously untimed --------------------
  # Individually cheap, but "likely fine" was an inference. These turn a dozen
  # UNKNOWN verdicts into measurements.
  - name: asset-accessories
    path: /api/assets/{asset_id}/accessories

  - name: asset-derived-assets
    path: /api/assets/{asset_id}/derived_assets

  - name: asset-transform-requests
    path: /api/assets/{asset_id}/transform_requests

  - name: asset-metadata-one
    path: /api/assets/{asset_id}/metadata/{metadata_id}
    note: metadata_id is read from this asset's own metadata list

  - name: stream-one
    path: /api/streams/{stream_id}

  - name: id-scheme-one
    path: /api/id_schemes/{scheme_id}

  - name: title-types-all
    path: /api/title_types
    note: bounded by the number of title types, which is small and fixed

  - name: title-type-one
    path: /api/title_types/{title_type_id}

  - name: child-tags
    path: /api/tags/{tag_id}/tags
    query: {limit: 50}
    note: keyset like the parent listing; first screen of one tag's children

  - name: title-ids
    path: /api/titles/{title_id}/ids
    note: >-
      uncapped, and each row lazy-loads its scheme; this is the endpoint the
      report flagged for one extra SELECT per identifier

  - name: title-references
    path: /api/titles/{title_id}/references

  # The log viewer is the first thing anyone opens when a transform fails, so
  # this endpoint sits on the critical path of the Operations surface. It had
  # never been measured: `request_id` resolves to the lowest-numbered request,
  # which is not actioned, and the endpoint 409s before doing any work.
  #
  # It is also not what it looks like. `/logs` is not a database collection --
  # `TransformRequestService.get_transform_request_logs` delegates to
  # `ProviderRegistry.fetch_logs`, which for the Prefect provider is an HTTP
  # round-trip to the orchestration backend with `limit=self._log_limit`
  # (default 100). So there is no "largest log in the data" to select for, the
  # response *is* capped, and the cost is an external call rather than a query.
  # The webhook provider and any unparseable transform type return `[]`.
  #
  # What can be measured is the endpoint doing its work: an actioned request,
  # which is the precondition the service checks first. If the orchestration
  # backend is unreachable from the probed instance the result is recorded as a
  # failure with that reason, which is the honest outcome rather than a fast
  # success against an empty list.
  - name: transform-request-logs
    path: /api/transform_requests/{request_id}/logs
    note: >-
      an external round-trip to the orchestration backend, not a database read.
      Capped at the provider's log limit (100 by default), so the worst case is
      bounded by that rather than by the collection size. An item count of 0
      means the backend returned no lines -- the endpoint did its work, but the
      timing is then the cost of reaching an orchestration backend that had
      nothing to give, not of rendering a full log.

  # -- artwork ------------------------------------------------------------
  # Read a `0 rows` measurement here as the cost of the read, not as evidence the
  # collection is small: an instance whose artwork table is empty answers these in
  # the time it takes to miss an index. The bound that matters is structural and
  # holds regardless -- `uq_artwork_one_primary_per_kind` allows one primary per
  # kind, and there are six kinds -- but the unfiltered lists are uncapped and a
  # backfilled instance is the only thing that measures them honestly.
  - name: artwork-kinds
    path: /api/artwork_kinds
    note: bounded by the seeded kinds, which is small and fixed at six

  - name: artwork-page-1
    path: /api/artwork
    query: {limit: 50}
    note: >-
      default first page of the collection route. Unlike the nested per-entity
      artwork reads above this one is capped by `KeysetPagination`, so it is the
      only artwork listing whose cost does not grow with the entity behind it

  - name: title-artwork
    path: /api/titles/{title_id}/artwork
    note: uncapped, and returns a bare array rather than a page

  - name: title-artwork-by-kind
    path: /api/titles/{title_id}/artwork
    query: {kind: poster}
    note: >-
      the `kind` filter Phase 2 could not trace statically, because it looks for
      an `if params.kind` branch and the repository names the parameter
      `kind_id`. It is applied; this times it

  # There is deliberately only one probe on this route, tempting as an
  # empty/populated pair is. A probe attaches to an endpoint by its path
  # *template*, so a second variable would have to be spelled exactly as the route
  # declares its parameter -- `/api/assets/{covered_asset_id}/artwork` matches no
  # route and its timing is reported as unattached rather than against this
  # endpoint, the same trap the `parent_title_id` note above describes. One id per
  # route parameter is the limit, and `asset_id` is the oldest asset, so this
  # measures the ordinary case: most assets carry no artwork at all. The populated
  # case is covered by `artwork-page-1` reading the collection directly.
  - name: asset-artwork
    path: /api/assets/{asset_id}/artwork
    note: uncapped, and returns a bare array rather than a page

  - name: artwork-one
    path: /api/artwork/{artwork_id}
    note: >-
      index-covered detail read. Reports `unavailable` rather than a timing on an
      instance holding no artwork -- see the note on the `artwork_id` variable

  # -- identifier lookups -------------------------------------------------
  # Probed with an external id no row holds. A miss runs the same query as a hit
  # and cannot short-circuit, so it measures the lookup honestly without needing
  # the instance to hold a particular scheme/identifier pairing.
  - name: asset-by-scheme
    path: /api/assets/by-scheme/{scheme_id}/{external_id}
    expect_status: [404]
    note: measures the lookup, which costs the same whether or not it finds a row

  - name: title-by-scheme
    path: /api/titles/by-scheme/{scheme_id}/{external_id}
    expect_status: [404]
    note: measures the lookup, which costs the same whether or not it finds a row

  - name: external-id-resolve
    path: /api/external-ids/resolve
    query: {scheme: "{scheme_code}", external_id: "{external_id}"}
    expect_status: [404]
    note: >-
      the join the report judged index coverage for; the composite
      uq(scheme_id, external_id) serves it because the join pins scheme_id

  # -- unauthenticated surface ------------------------------------------
  - name: health
    path: /api/health
    note: unauthenticated; opens its own database and Elasticsearch connections

  - name: version
    path: /api/version

  - name: ping
    path: /api/ping

# ===========================================================================
# PHASE 6 -- WRITE PROBES
# ===========================================================================
#
# These are NOT part of the Phase 4 suite above and are not reached through
# `allowlist`. `probes.load_config` never reads this key.
#
# That separation is deliberate. `allowlist` being empty is what makes Phase 4
# structurally incapable of mutating the production-backed instance it runs
# against; adding write probes to it would trade that guarantee for the
# convenience of one loader. Phase 6 has its own loader, its own environment
# variables, and its own `--allow-writes` flag, and it refuses to run until it
# has positively proven that its instance and its database are one disposable
# system.
#
# SCENARIO KINDS
#   repeat     Send the identical request twice. Classifies the route
#              `idempotent`, `guarded` or `duplicating` from what actually
#              happened -- never from the verb. This is 6b.
#   violation  Provoke a named constraint and record verbatim what the API
#              returns. A 5xx here is the finding, and so is a 4xx whose body
#              says nothing a user could act on. This is 6c and 6d.
#   omission   Create a row, re-send it without one field and then with that
#              field explicitly null, re-reading after each. Confirms by
#              experiment what the static `exclude_none` trace derived. 6a.
#
# CLEANUP -- AND WHY IT NEEDS THE DATABASE
#   The API is not a complete inverse of itself. There is no DELETE for
#   titles, assets, tags or id_schemes: the library's primary objects cannot
#   be removed over HTTP at all. A probe that creates a Title therefore cannot
#   undo itself through the interface it is probing, which is why a scenario
#   declares `sql_cleanup` and why Phase 6 requires CAPINV_WRITE_DATABASE_URL
#   rather than only a base URL. Table and column names are checked against a
#   closed list in the runner, because they reach an identifier position where
#   no parameter binding is possible.
#
#   `cleanup` (HTTP) is preferred wherever a route exists, so teardown
#   exercises the same cascades a real client would. `sql_cleanup` is the
#   fallback for what has no route.
#
# FILESYSTEM
#   `needs_media_root: true` marks a scenario that writes bytes. It is skipped
#   and recorded UNKNOWN unless CAPINV_WRITE_MEDIA_ROOT names a scratch root.
#   It is never run against a real one.
#
# BRACES
#   Paths carry `{placeholder}` substitutions, which YAML reads as a flow
#   mapping inside `{...}`. Every such value is written in block style or
#   quoted; an unquoted one is a parse error, not a silent misread.
write_probes:
  scenarios:

    # -- 6b: repetition, on the routes a UI will actually retry --------------

    - name: contents-attach-asset-twice
      endpoint: POST /api/titles/{parent_title_id}/contents
      kind: repeat
      setup:
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe parent A
            title_type: collection
          capture:
            parent: id
          sql_cleanup:
            table: titles
            id_var: parent
        - method: POST
          path: /api/assets/
          body:
            filename: capinv-probe-a.mkv
            path: /capinv-probe/a.mkv
            size: 1024
            duration: 1.0
            bitrate: 1000
          capture:
            asset: id
          sql_cleanup:
            table: assets
            id_var: asset
      act:
        method: POST
        path: /api/titles/{parent}/contents
        body:
          kind: asset
          asset_id: "{asset}"
      act_sql_table: title_contents
      note: >-
        the attach a browse UI retries after a dropped connection. Guarded by
        `uq_parent_asset_once`, a partial unique index rather than a table
        constraint -- so whether it surfaces as a conflict or a 500 is exactly
        what this measures.

    - name: contents-attach-title-twice
      endpoint: POST /api/titles/{parent_title_id}/contents
      kind: repeat
      setup:
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe parent B
            title_type: collection
          capture:
            parent: id
          sql_cleanup:
            table: titles
            id_var: parent
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe child B
            title_type: movie
          capture:
            child: id
          sql_cleanup:
            table: titles
            id_var: child
      act:
        method: POST
        path: /api/titles/{parent}/contents
        body:
          kind: title
          child_title_id: "{child}"
      act_sql_table: title_contents
      note: >-
        the title-to-title edge. `uq_parent_asset_once` covers the asset edge
        only, so this pair asks whether the title edge is guarded at all -- and
        a curated collection is built entirely out of these.

    - name: title-tags-attach-twice
      endpoint: POST /api/titles/{title_id}/tags
      kind: repeat
      setup:
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe tagged title
            title_type: movie
          capture:
            title: id
          sql_cleanup:
            table: titles
            id_var: title
      act:
        method: POST
        path: /api/titles/{title}/tags
        body:
          tag_names:
            - capinv-probe-tag
      sql_cleanup:
        - table: tags
          column: name
          value: capinv-probe-tag
      note: >-
        tagging by free-text name, which creates the tag if it does not exist.
        Sending it twice asks both whether the edge duplicates and whether a
        second tag row appears. The tag it creates has no captured id, so it is
        cleaned up by name.

    - name: title-external-id-attach-twice
      endpoint: POST /api/titles/{title_id}/ids
      kind: repeat
      constraint: uq_external_identifier_scheme_id
      setup:
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe identified title
            title_type: movie
          capture:
            title: id
          sql_cleanup:
            table: titles
            id_var: title
        - method: POST
          path: /api/id_schemes
          body:
            code: capinv-scheme
            label: Capinv probe scheme
          capture:
            scheme: id
          sql_cleanup:
            table: id_schemes
            id_var: scheme
      act:
        method: POST
        path: /api/titles/{title}/ids
        body:
          scheme_id: "{scheme}"
          external_id: capinv-probe-ext-1
      note: >-
        the identifier attach. `uq_external_identifier_scheme_id` makes
        (scheme, external_id) unique across titles, so the repeat is also the
        constraint probe. Note the scheme code is 13 characters: `id_schemes.code`
        is varchar(16) and a longer one fails in a way worth reading below.

    - name: contents-move-twice
      endpoint: POST /api/titles/{destination_title_id}/contents/{title_contents_id}/move
      kind: repeat
      setup:
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe move source
            title_type: collection
          capture:
            source: id
          sql_cleanup:
            table: titles
            id_var: source
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe move destination
            title_type: collection
          capture:
            destination: id
          sql_cleanup:
            table: titles
            id_var: destination
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe move child
            title_type: movie
          capture:
            child: id
          sql_cleanup:
            table: titles
            id_var: child
        - method: POST
          path: /api/titles/{source}/contents
          body:
            kind: title
            child_title_id: "{child}"
          capture:
            edge: id
          sql_cleanup:
            table: title_contents
            id_var: edge
      act:
        method: POST
        path: /api/titles/{destination}/contents/{edge}/move
      note: >-
        the drag a tree retries after a dropped connection, and the one write in
        this API whose second attempt is *expected* to succeed rather than
        conflict: the edge is already where the request asks it to be, so the
        repeat repositions it within the destination and changes nothing else.
        A conflict here would mean a UI has to treat its own retry as a failure,
        and a second row would mean the move is a copy. Neither is what #178
        asked for, and this is what says which one shipped.

    - name: contents-batch-attach-twice
      endpoint: POST /api/titles/{parent_title_id}/contents/batch
      kind: repeat
      setup:
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe batch parent
            title_type: collection
          capture:
            parent: id
          sql_cleanup:
            table: titles
            id_var: parent
        - method: POST
          path: /api/assets/
          body:
            filename: capinv-probe-batch.mkv
            path: /capinv-probe/batch.mkv
            size: 1024
            duration: 1.0
            bitrate: 1000
          capture:
            asset: id
          sql_cleanup:
            table: assets
            id_var: asset
      act:
        method: POST
        path: /api/titles/{parent}/contents/batch
        body:
          items:
            - kind: asset
              asset_id: "{asset}"
      act_sql_table: title_contents
      note: >-
        the bulk placement a UI retries after a dropped connection. The batch is
        all-or-nothing, so the question this answers is whether a repeat is
        *refused* rather than half-applied: `uq_parent_asset_once` should reject
        the second attempt outright, leaving the first batch's rows exactly as
        they were. A duplicating verdict here would mean bulk placement doubles
        a directory on a retry, which is the worst outcome of the three.

    # -- 6c / 6d: constraint violations, and what the API makes of them ------

    - name: title-contains-itself
      endpoint: POST /api/titles/{parent_title_id}/contents
      kind: violation
      constraint: no_self_containment_chk
      setup:
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe self-contain
            title_type: collection
          capture:
            title: id
          sql_cleanup:
            table: titles
            id_var: title
      act:
        method: POST
        path: /api/titles/{title}/contents
        body:
          kind: title
          child_title_id: "{title}"
      note: >-
        the shortest containment cycle, and the only one the database rules out
        declaratively. 263 of these existed in production, so a UI that builds
        collections will reach it.

    - name: contents-two-targets
      endpoint: POST /api/titles/{parent_title_id}/contents
      kind: violation
      constraint: one_target_chk
      setup:
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe two-target
            title_type: collection
          capture:
            parent: id
          sql_cleanup:
            table: titles
            id_var: parent
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe two-target child
            title_type: movie
          capture:
            child: id
          sql_cleanup:
            table: titles
            id_var: child
        - method: POST
          path: /api/assets/
          body:
            filename: capinv-probe-b.mkv
            path: /capinv-probe/b.mkv
            size: 1024
            duration: 1.0
            bitrate: 1000
          capture:
            asset: id
          sql_cleanup:
            table: assets
            id_var: asset
      act:
        method: POST
        path: /api/titles/{parent}/contents
        body:
          kind: asset
          asset_id: "{asset}"
          child_title_id: "{child}"
      note: >-
        discriminator and payload disagree. Whether this is caught by the schema
        or reaches the check constraint decides whether a form can explain
        itself -- watch the `loc` in the response body, not just the status.

    - name: tag-duplicate-name
      endpoint: POST /api/tags
      kind: repeat
      constraint: ix_tags_name
      act:
        method: POST
        path: /api/tags
        body:
          name: capinv-probe-dupe-tag
      act_sql_table: tags
      note: >-
        tag names are globally unique, and a management UI creates tags from
        free text, so this is the most reachable unique violation on the whole
        surface.

    - name: id-scheme-duplicate-code
      endpoint: POST /api/id_schemes
      kind: repeat
      constraint: ix_id_schemes_code
      act:
        method: POST
        path: /api/id_schemes
        body:
          code: capinv-dupe
          label: Capinv probe duplicate
      act_sql_table: id_schemes
      note: >-
        scheme codes are the vocabulary the identifier UI is built on, created
        rarely and by hand -- exactly the conditions under which a double submit
        happens.

    - name: id-scheme-code-too-long
      endpoint: POST /api/id_schemes
      kind: violation
      constraint: id_schemes.code varchar(16)
      act:
        method: POST
        path: /api/id_schemes
        body:
          code: capinv-probe-scheme
          label: Capinv probe overlong code
      act_sql_table: id_schemes
      note: >-
        a nineteen-character code against a varchar(16) column. The schema
        declares no maxLength, so nothing rejects it before the database does.
        This probe exists for what the API makes of that, which is not what a
        reader would predict -- see the Error taxonomy.

    # -- 6a: confirming the exclude_none trace by experiment -----------------

    - name: title-patch-omission
      endpoint: PATCH /api/titles/{title_id}
      kind: omission
      field: synopsis
      setup:
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe patch semantics
            title_type: movie
            synopsis: capinv probe original synopsis
          capture:
            title: id
          sql_cleanup:
            table: titles
            id_var: title
      read:
        method: GET
        path: /api/titles/{title}
      act:
        method: PATCH
        path: /api/titles/{title}
      note: >-
        the derivation says omitted-means-unchanged, and that an explicit null is
        discarded by the same rule so the field cannot be cleared. This checks
        that against the running system rather than trusting the call-site trace.

    - name: title-artwork-upload-twice
      endpoint: POST /api/titles/{title_id}/artwork
      kind: repeat
      needs_media_root: true
      constraint: uq_artwork_entity_storage_path
      setup:
        - method: POST
          path: /api/titles/
          body:
            name: capinv probe artwork title
            title_type: movie
          capture:
            title: id
          sql_cleanup:
            table: titles
            id_var: title
      act:
        method: POST
        path: /api/titles/{title}/artwork
      note: >-
        writes bytes into the artwork root and is content-addressed, so the
        repeat is also the `uq_artwork_entity_storage_path` probe. Skipped and
        reported UNKNOWN unless CAPINV_WRITE_MEDIA_ROOT names a scratch root --
        never run against a real one.
