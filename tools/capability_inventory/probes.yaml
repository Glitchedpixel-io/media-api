# Declarative probe definitions for the capability inventory.
#
# Edit this file to change what Phase 4 measures. Nothing here requires a code
# change, and the harness validates every entry before issuing a single request.
#
# SAFETY
#   The runner refuses any method other than GET unless the exact
#   "METHOD /path" appears in `allowlist` below. `allowlist` ships empty and
#   should stay that way unless you are deliberately probing a write against an
#   instance you are willing to mutate. Probing production writes is not a thing
#   this harness will do by accident.
#
# VARIABLES
#   `{name}` placeholders in a probe's `path`, and in any string value under its
#   `query`, are filled from `variables`.
#   A variable is resolved against the API itself, so probes stay valid as the
#   library changes and the file needs no ids hard-coded into it. If resolution
#   fails, every probe depending on that variable is reported as `unavailable`
#   with the reason -- never silently skipped.
#
# FAILURE-MODE PROBES
#   `records_failure_mode: true` marks a probe that exists to record *how* something
#   fails rather than what it costs. Such a probe is reported like any other and
#   contributes nothing to a verdict: its timing describes the failure path, not the
#   endpoint doing its work.
#
#   Set it whenever `expect_status` accepts a status meaning the endpoint did not do
#   its job. Do not set it merely because a status is not 2xx -- a by-scheme lookup
#   that misses runs the same query as one that hits, and an unsatisfiable range is
#   the endpoint behaving correctly. Both are real measurements.
#
#   Never put a query string in `path`. A path carrying `?` matches no route, so
#   the probe would time successfully but its result could not be attached to an
#   endpoint, which reports UNKNOWN while this file still looks correct. The
#   loader rejects it.

version: 1

defaults:
  # Runs after the discarded warm-up. p50 and p95 are computed over these.
  runs: 7
  warmup: 1
  timeout_seconds: 30

# Non-GET routes that may be probed. Keep empty for read-only runs.
#
# It is deliberately empty, and the mutating endpoints are deliberately unmeasured
# as a result. Timing a write means performing it, and this report is run against
# production data; the alternatives -- a seeded throwaway instance, or writing and
# undoing -- either measure the wrong scale or leave the mutation behind when a
# probe run dies part-way. What a write costs is established from its query shape
# instead, and the per-payload cost of the tag writes is asserted by a query-count
# test rather than a timing.
allowlist: []

variables:
  asset_id:
    from_endpoint: /api/assets/
    query: {limit: 1, sort: "id:asc"}
    pick: items.0.id
  title_id:
    from_endpoint: /api/titles/
    query: {limit: 1, sort: "id:asc"}
    pick: items.0.id
  # Same value as title_id. `/api/titles/{parent_title_id}/contents` names its
  # path parameter differently, and a probe path has to spell the placeholder
  # exactly as the route declares it or the result cannot be attached to it.
  parent_title_id:
    from_endpoint: /api/titles/
    query: {limit: 1, sort: "id:asc"}
    pick: items.0.id
  tag_id:
    from_endpoint: /api/tags
    query: {limit: 1, sort: "id:asc"}
    pick: items.0.id
  scheme_id:
    from_endpoint: /api/id_schemes
    pick: 0.id
  # The title with the most children, so the "4000-item case" is measured rather
  # than assumed. Resolved by asking for the largest collection the API exposes.
  # `/api/transform_requests/{request_id}` names its path parameter `request_id`.
  request_id:
    from_endpoint: /api/transform_requests
    query: {limit: 1, sort: "id:asc"}
    pick: items.0.id
  stream_id:
    from_endpoint: /api/streams
    query: {limit: 1, sort: "id:asc"}
    pick: items.0.id
  title_type_id:
    from_endpoint: /api/title_types
    pick: 0.id
  # Read from an endpoint that is itself addressed by a variable. Resolution is
  # ordered by dependency, not alphabetically, so `asset_id` is available here.
  metadata_id:
    from_endpoint: /api/assets/{asset_id}/metadata
    pick: 0.id
  scheme_code:
    from_endpoint: /api/id_schemes
    pick: 0.code
  # Deliberately a value no row holds. A by-scheme lookup that misses runs the
  # same query as one that hits and cannot short-circuit, so it measures the scan
  # honestly -- and unlike a real pair it needs no title to happen to carry an
  # identifier in the scheme that `scheme_id` resolved to, which would couple
  # these probes to the shape of whatever data the instance holds.
  external_id:
    literal: "capinv-probe-no-such-external-id"

  # The newest asset, as the one likeliest to carry artwork.
  #
  # This is the only heuristic available: the API exposes no way to ask for an
  # entity that *has* artwork. There is no collection route over `artwork`, and
  # neither listing takes a "has artwork" filter, so artwork is reachable only
  # through an id a caller already holds. Picking the newest asset is not
  # arbitrary -- covers are fetched when an asset is acquired, so registrations
  # cluster at the top of the id range rather than spreading evenly.
  #
  # If that asset has no artwork the probes below measure the empty case and the
  # report records `0 items`, which is a true statement about that asset and not
  # a bound on the collection. `asset_id` deliberately stays on the *oldest*
  # asset, so the pair spans both cases.
  covered_asset_id:
    from_endpoint: /api/assets/
    query: {limit: 1, sort: "id:desc"}
    pick: items.0.id

  # Resolved from that asset's own artwork list, which is a direct read rather
  # than the recursive poster resolution -- one hop, and it does not depend on
  # the asset belonging to any title.
  #
  # It resolves nothing while the artwork table is empty, and every probe that
  # needs it is then reported `unavailable` with that reason rather than silently
  # skipped. An instance that has not had `tools/artwork_backfill` run against it
  # is in exactly that state: the schema and the seeded kinds are deployed, but
  # nothing has registered any artwork yet. Nothing in this file can fix that,
  # and it should not try -- no `fallback`, for the same reason the `runner_key`
  # note below gives.
  artwork_id:
    from_endpoint: /api/assets/{covered_asset_id}/artwork
    pick: 0.id

  # There is deliberately no `runner_key` variable, so
  # GET /api/runner_state/{runner_key} stays unprobed.
  #
  # A runner is provisioned with its own key and uses it to look up its
  # configuration, so no client ever discovers a key and there is no listing route
  # to resolve one from -- the absence is the design, not a gap. Do not add a
  # literal here: any key hardcoded in this file is wrong on every instance but the
  # one it was copied from, and a probe that 404s against a real key would report
  # the endpoint as broken rather than unmeasured.

probes:
  # -- happy path: first screen ------------------------------------------
  - name: assets-page-1
    path: /api/assets/
    query: {limit: 50}
    note: default first page a browse screen would issue

  - name: assets-page-1-with-includes
    path: /api/assets/
    query: {limit: 50, include: "tags,master_asset,external_ids"}
    note: same page with every optional relation eager-loaded

  - name: titles-page-1
    path: /api/titles/
    query: {limit: 50}

  # -- isolating poster resolution ---------------------------------------
  # `include=poster` returns the same rows as `titles-page-1` with one field
  # added, so the difference between the two probes is the resolution and
  # nothing else -- the same isolation the assets N+1 pair below uses.
  #
  # It is worth isolating because resolving a poster is not a per-row column
  # read: when a title has no artwork of its own the service walks its contents
  # to a bounded depth. The scaling probe says whether that walk is charged per
  # row of the page or once for the lot.
  - name: titles-page-1-with-poster
    path: /api/titles/
    query: {limit: 50, include: "poster"}
    note: first screen a browse grid would issue, with a poster per title

  - name: titles-poster-scaling-200-rows
    path: /api/titles/
    query: {limit: 200, include: "poster"}
    note: >-
      poster resolution against 200 rows -- compare with the 50-row probe above
      to tell a per-row walk from a fixed cost

  # The pair above resolves nothing on this library: the default page is the
  # oldest titles, which predate the covers, so every row walks its contents to
  # the depth limit and comes back empty. That is the *miss* path, and it is the
  # expensive one worth having -- but on its own it says nothing about what a
  # grid full of posters costs. Sorting newest-first hits instead of misses, and
  # the two together bracket the endpoint.
  #
  # Sort is the only lever available for this: neither listing can filter on
  # having artwork, so there is no way to ask for resolvable rows directly.
  - name: titles-newest-page
    path: /api/titles/
    query: {limit: 50, sort: "id:desc"}
    note: baseline for the pair below -- same rows, no resolution

  - name: titles-newest-page-with-poster
    path: /api/titles/
    query: {limit: 50, sort: "id:desc", include: "poster"}
    note: >-
      poster resolution where it finds a row for most of the page; the gap from
      `titles-newest-page` is the hit path, against the miss path measured above

  - name: tags-page-1
    path: /api/tags
    query: {limit: 50}

  - name: transform-requests-page-1
    path: /api/transform_requests
    query: {limit: 50}

  # -- isolating the two independent costs -------------------------------
  # `assets-page-1` and `assets-page-1-with-includes` return byte-identical
  # payloads. Any latency difference between them is the per-row lazy load on
  # AssetORM.external_ids and nothing else, because `include=` converts those
  # per-row SELECTs into one selectinload. The scaling probes then show whether
  # that cost is linear in the number of rows, which is what distinguishes an
  # N+1 from a fixed overhead.
  - name: assets-scaling-10-rows
    path: /api/assets/
    query: {limit: 10}
    note: N+1 scaling, 10 rows

  - name: assets-scaling-200-rows
    path: /api/assets/
    query: {limit: 200}
    note: N+1 scaling, 200 rows -- compare against the 10- and 50-row probes

  # -- realistic worst case ---------------------------------------------
  - name: assets-max-page-unindexed-sort
    path: /api/assets/
    query: {limit: 500, sort: "size:desc"}
    note: largest permitted page on an unindexed sort key, N+1 left in place

  - name: assets-max-page-unindexed-sort-no-n1
    path: /api/assets/
    query: {limit: 500, sort: "size:desc", include: "external_ids"}
    note: >-
      the same worst case with the per-row lazy load eliminated. The gap between
      this and the probe above is the N+1; what remains is the sort itself

  - name: assets-indexed-sort-no-n1
    path: /api/assets/
    query: {limit: 500, sort: "id:asc", include: "external_ids"}
    note: >-
      control for the probe above -- an indexed sort key with the N+1 removed, so
      the two differ only in whether the sort column is indexed


  - name: assets-broadest-filter
    path: /api/assets/
    query: {limit: 50, path_part: "e"}
    note: substring filter matching almost everything; sequential scan by construction

  - name: titles-name-substring
    path: /api/titles/
    query: {limit: 50, name: "e"}
    note: leading-wildcard name search, the broadest a UI search box can send

  # -- deep pagination ---------------------------------------------------
  - name: assets-deep-page
    path: /api/assets/
    query: {limit: 50}
    paginate: {style: keyset, pages: 40}
    note: page 41 reached by following cursors; compare against assets-page-1

  - name: titles-deep-page
    path: /api/titles/
    query: {limit: 50}
    paginate: {style: keyset, pages: 40}

  - name: search-transcripts-page-1
    path: /api/search/transcripts
    query: {q: "the", size: 25, offset: 0}

  - name: search-transcripts-deep-page
    path: /api/search/transcripts
    query: {q: "the", size: 25}
    paginate: {style: offset, offset: 9975}
    note: last page inside the default 10,000 max_result_window

  - name: search-transcripts-past-window
    path: /api/search/transcripts
    query: {q: "the", size: 25}
    paginate: {style: offset, offset: 10000}
    expect_status: [200, 500, 503]
    records_failure_mode: true
    note: deliberately past max_result_window; records how the failure surfaces

  # -- unbounded collections --------------------------------------------
  - name: streams-page-1
    path: /api/streams
    query: {limit: 50}
    note: default first page a browse screen would issue

  - name: streams-max-page
    path: /api/streams
    query: {limit: 500}
    note: largest permitted page; the old uncapped response was 65,739 rows and 15.15MB

  - name: streams-by-asset
    path: /api/streams
    query: {asset_id: "{asset_id}", limit: 50}
    note: >-
      the filtered read a client actually wants; streams.asset_id is unindexed until #53
      lands, so a slow result here is that index, not the paging

  - name: inbox-full
    path: /api/inbox
    note: >-
      the default walk, bounded by MAX_DEPTH and MAX_ITEMS; size depends on what is
      sitting in the inbox at the time, so read it as a sample rather than a ceiling

  - name: inbox-top-level
    path: /api/inbox
    query: {depth: 1}
    note: one level only, the cheapest useful request a client can make

  - name: id-schemes-all
    path: /api/id_schemes

  - name: title-contents
    path: /api/titles/{parent_title_id}/contents
    note: unpaginated child list; size is whatever that title happens to hold

  - name: asset-streams
    path: /api/assets/{asset_id}/streams

  - name: asset-metadata
    path: /api/assets/{asset_id}/metadata

  - name: asset-external-ids
    path: /api/assets/{asset_id}/ids

  - name: asset-tags
    path: /api/assets/{asset_id}/tags

  - name: asset-titles
    path: /api/assets/{asset_id}/titles

  - name: title-tags
    path: /api/titles/{title_id}/tags

  # -- single-object reads ----------------------------------------------
  - name: asset-detail
    path: /api/assets/{asset_id}

  - name: title-detail
    path: /api/titles/{title_id}

  - name: title-detail-with-poster
    path: /api/titles/{title_id}
    query: {include: "poster"}
    note: >-
      pairs with `title-detail` the way the listing pair above does: one title's
      share of the contents walk, which a detail view pays on its own

  - name: tag-detail
    path: /api/tags/{tag_id}

  - name: transform-request-detail
    path: /api/transform_requests/{request_id}

  # -- streaming ---------------------------------------------------------
  # A 404 from any of these means the probed instance has no file for the asset
  # that `asset_id` resolved to -- almost always a run pointed at a real database
  # with the media root not mounted alongside it. It is not evidence that ranges
  # are broken: the 200, 206, suffix-206, 416, 400 and traversal cases are all
  # asserted in tests/unit/api/test_file_stream_router.py and
  # tests/integration/api/test_file_stream_api.py, the latter against a real row
  # and a real file. What these probes add is timing at production scale, which
  # only a mounted media root can provide.
  - name: fetch-asset-stream
    path: /api/fetch/{asset_id}
    stream: true
    note: >-
      time-to-first-byte measured separately from total transfer; a 404 here means
      no file on this instance, not a broken endpoint -- see the note above

  - name: fetch-asset-range
    path: /api/fetch/{asset_id}
    stream: true
    headers: {Range: "bytes=0-1048575"}
    expect_status: [206]
    note: >-
      first mebibyte only; verifies Content-Range and Accept-Ranges; a 404 means no file on this instance

  - name: fetch-asset-range-suffix
    path: /api/fetch/{asset_id}
    stream: true
    headers: {Range: "bytes=-65536"}
    expect_status: [206]
    note: >-
      suffix range, the form a seek-to-end scrub issues; a 404 means no file on this instance

  - name: fetch-asset-range-unsatisfiable
    path: /api/fetch/{asset_id}
    stream: true
    headers: {Range: "bytes=99999999999999-"}
    expect_status: [416]
    note: >-
      verifies the unsatisfiable case returns 416 with a Content-Range header; a 404 means no file on this instance

  # -- detail reads: index-covered, previously untimed --------------------
  # Individually cheap, but "likely fine" was an inference. These turn a dozen
  # UNKNOWN verdicts into measurements.
  - name: asset-accessories
    path: /api/assets/{asset_id}/accessories

  - name: asset-derived-assets
    path: /api/assets/{asset_id}/derived_assets

  - name: asset-transform-requests
    path: /api/assets/{asset_id}/transform_requests

  - name: asset-metadata-one
    path: /api/assets/{asset_id}/metadata/{metadata_id}
    note: metadata_id is read from this asset's own metadata list

  - name: stream-one
    path: /api/streams/{stream_id}

  - name: id-scheme-one
    path: /api/id_schemes/{scheme_id}

  - name: title-types-all
    path: /api/title_types
    note: bounded by the number of title types, which is small and fixed

  - name: title-type-one
    path: /api/title_types/{title_type_id}

  - name: child-tags
    path: /api/tags/{tag_id}/tags
    query: {limit: 50}
    note: keyset like the parent listing; first screen of one tag's children

  - name: title-ids
    path: /api/titles/{title_id}/ids
    note: >-
      uncapped, and each row lazy-loads its scheme; this is the endpoint the
      report flagged for one extra SELECT per identifier

  - name: title-references
    path: /api/titles/{title_id}/references

  - name: transform-request-logs
    path: /api/transform_requests/{request_id}/logs
    note: uncapped; the collection size behind it was never measured

  # -- artwork ------------------------------------------------------------
  # Read a `0 rows` measurement here as the cost of the read, not as evidence the
  # collection is small: an instance whose artwork table is empty answers these in
  # the time it takes to miss an index. The bound that matters is structural and
  # holds regardless -- `uq_artwork_one_primary_per_kind` allows one primary per
  # kind, and there are six kinds -- but the unfiltered lists are uncapped and a
  # backfilled instance is the only thing that measures them honestly.
  - name: artwork-kinds
    path: /api/artwork_kinds
    note: bounded by the seeded kinds, which is small and fixed at six

  - name: title-artwork
    path: /api/titles/{title_id}/artwork
    note: uncapped, and returns a bare array rather than a page

  - name: title-artwork-by-kind
    path: /api/titles/{title_id}/artwork
    query: {kind: poster}
    note: >-
      the `kind` filter Phase 2 could not trace statically, because it looks for
      an `if params.kind` branch and the repository names the parameter
      `kind_id`. It is applied; this times it

  # There is deliberately no second probe here on `{covered_asset_id}`, tempting
  # as the empty/populated pair is. A probe attaches to an endpoint by its path
  # *template*, so the placeholder has to be spelled exactly as the route
  # declares it -- `/api/assets/{covered_asset_id}/artwork` matches no route and
  # its timing is reported as unattached rather than against this endpoint, the
  # same trap the `parent_title_id` note above describes. One id per route
  # parameter is the limit, and `asset_id` is the oldest asset, so this measures
  # the ordinary case: most assets carry no artwork at all.
  - name: asset-artwork
    path: /api/assets/{asset_id}/artwork
    note: uncapped, and returns a bare array rather than a page

  - name: artwork-one
    path: /api/artwork/{artwork_id}
    note: >-
      index-covered detail read. Reports `unavailable` rather than a timing on an
      instance holding no artwork -- see the note on the `artwork_id` variable

  # -- identifier lookups -------------------------------------------------
  # Probed with an external id no row holds. A miss runs the same query as a hit
  # and cannot short-circuit, so it measures the lookup honestly without needing
  # the instance to hold a particular scheme/identifier pairing.
  - name: asset-by-scheme
    path: /api/assets/by-scheme/{scheme_id}/{external_id}
    expect_status: [404]
    note: measures the lookup, which costs the same whether or not it finds a row

  - name: title-by-scheme
    path: /api/titles/by-scheme/{scheme_id}/{external_id}
    expect_status: [404]
    note: measures the lookup, which costs the same whether or not it finds a row

  - name: external-id-resolve
    path: /api/external-ids/resolve
    query: {scheme: "{scheme_code}", external_id: "{external_id}"}
    expect_status: [404]
    note: >-
      the join the report judged index coverage for; the composite
      uq(scheme_id, external_id) serves it because the join pins scheme_id

  # -- unauthenticated surface ------------------------------------------
  - name: health
    path: /api/health
    note: unauthenticated; opens its own database and Elasticsearch connections

  - name: version
    path: /api/version

  - name: ping
    path: /api/ping
